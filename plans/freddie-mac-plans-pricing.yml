description: 'Freddie Mac publishes no plans and no prices for its APIs. There is no pricing page, no
  tier list, no free tier and no self-service signup. The Developer Portal''s own Getting Started page
  states the only route: contact your Freddie Mac representative or the Contact Us form, request a Developer
  Portal username and your organisation''s system-to-system API credentials, then log in. Eligibility
  is counterparty status - Seller/Servicer approval or an approved technology-partner relationship - and
  the cost of the APIs is embedded in the counterparty economics (guarantee fees, delivery fees, Loan
  Advisor Suite access) rather than billed per call. plan_count is 0 because that is the honest number,
  not because nothing was found.'
notes: Re-verified 2026-09-10 against the live portal. The public API catalog (https://developer.freddiemac.com/public/api-catalog,
  200 application/json, 20 APIs) and every OpenAPI in it are anonymously readable - the documentation
  is open, the access is not.

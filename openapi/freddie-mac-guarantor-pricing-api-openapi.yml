openapi: 3.2.0
info:
  title: Guarantor Pricing API
  description: Obtain Single Issue or MultiLender buyup/buydown ratios and all applicable credit fees.
  version: 1.0.0
servers:
- url: https://lassvcs-uat.fmrei.com/ESO/rest
security:
- basicAuth: []
tags:
- name: Guarantor Pricing
  description: Obtain Single Issue or MultiLender buyup/buydown ratios and all applicable credit fees.
paths:
  /EWSG_PricingGuarantorSheetV1.0:
    post:
      operationId: price
      tags:
      - Guarantor Pricing
      summary: Guarantor Pricing
      parameters:
      - name: Content-Type
        in: header
        description: Content type to be passed as a header
        required: true
        schema:
          type: string
          default: application/json
      - name: env
        in: header
        description: 'Environment:'
        schema:
          type: string
          enum:
          - ProductionBaseline
          - Pre-Production
          default: ProductionBaseline
      - name: version
        in: header
        description: API Version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: 'Please change following fields to submit a valid request and ''Try it out'' (where applicable): <div><ul><li> RequestingPartyAccountIdentifier</li><li> CounterPartyType </li><li>SellerIdentifier</li><li>PricingIdentifier</li></ul></div> <br/> <b>Please refer to RELATED DOCUMENTATION for more examples.</b>'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequest'
            examples:
              Price Request BUBD All:
                $ref: '#/components/examples/PriceRequestGuarantorBUBDAll'
              Price Request CFFD All:
                $ref: '#/components/examples/PriceRequestGuarantorCFFDAll'
              Price Request CFP All:
                $ref: '#/components/examples/PriceRequestGuarantorCFPAll'
              Price Request CFY All:
                $ref: '#/components/examples/PriceRequestGuarantorCFYAll'
              Price Request BUBD Specific:
                $ref: '#/components/examples/PriceRequestGuarantorBUBDSpecific'
              Price Request CFFD Specific:
                $ref: '#/components/examples/PriceRequestGuarantorCFFDSpecific'
              Price Request CFP Specific:
                $ref: '#/components/examples/PriceRequestGuarantorCFPSpecific'
              Price Request CFY Specific:
                $ref: '#/components/examples/PriceRequestGuarantorCFYSpecific'
        required: true
      responses:
        '200':
          description: "<b>OK</b> \n\n <font size='2' color='black'><b>Business error codes and details can be found in related documentation.</b></font>\n\n <B>Scenarios</B> \n\n <B>7526</B> The Security Product provided is not eligible. Please provide a valid Security Product. \n\n <B>7719</B> Correlation Identifier is not unique. \n\n <B>DQR1002</B> Settlement Date Range Begin Date must not be earlier than the current date. \n\n <B>DQR1001</B> Pricing Type must be one of the valid values: Buyup/BuydownRatios, CreditFeesInFixedDollar, CreditFeesInPrice, CreditFeesInYield. \n\n <B>DQR1004</B> Settlement Date Range End Date must not be more than 90 days after Settlement Date Range Begin Date. \n\n <B>SE1000</B> An error occured while processing your request. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance. \n\n "
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
              examples:
                Price Response BUBD All:
                  $ref: '#/components/examples/PriceResponseGuarantorBUBDAll'
                Price Response CFFD All:
                  $ref: '#/components/examples/PriceResponseGuarantorCFFDAll'
                Price Response CFP All:
                  $ref: '#/components/examples/PriceResponseGuarantorCFPAll'
                Price Response CFY All:
                  $ref: '#/components/examples/PriceResponseGuarantorCFYAll'
                Price Response BUBD Specific:
                  $ref: '#/components/examples/PriceResponseGuarantorBUBDSpecific'
                Price Response CFFD Specific:
                  $ref: '#/components/examples/PriceResponseGuarantorCFFDSpecific'
                Price Response CFP Specific:
                  $ref: '#/components/examples/PriceResponseGuarantorCFPSpecific'
                Price Response CFY Specific:
                  $ref: '#/components/examples/PriceResponseGuarantorCFYSpecific'
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>401</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse401'
              example:
                Error: Rejected by policy
        '404':
          description: "<b>Not Found</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>404</b> Not Found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse404'
              example:
                fault:
                  faultstring: 'Unable to identify proxy for host: secure-ewsglas and url: /ESO/rest/EWSG_PricingCashSheetV'
                  detail:
                    errorcode: messaging.adaptors.http.flow.ApplicationNotFound
        '429':
          description: "<b>Too Many Requests</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>429.001</b> Rate limit exceeded, decrease the number of requests per second been sent. \n\n <b>429.002</b> Quota limit exceeded, decrease the number of requests per minute been sent."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse429'
              example:
                code: 429.001
                message: Rate limit exceeded
                details:
                - error: Rate limit exceeded, decrease the number of requests per second been sent.
        '500':
          description: "<b>Internal server error.</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>500</b> Message too large \n\n <b>500</b> Invalid JSON format \n\n"
          content:
            text/plain:
              example: 'Error : Invalid JSON format'
components:
  schemas:
    criteriaDetails:
      type: object
      additionalProperties: false
      required:
      - row
      properties:
        row:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - column
            properties:
              column:
                type: array
                additionalProperties: false
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - attributeName
                  - type
                  properties:
                    attributeName:
                      type: string
                      description: Identifies the attribute for the credit fee constraint.
                    value:
                      type: string
                      description: The actual value that is used to compare against the criteria attribute.
                    type:
                      type: string
                      description: The type of credit fee constraint for the category.
                    operator:
                      type: string
                      description: An operator determining the criteria of a fee.
                    minOperator:
                      type: string
                      description: Operator for minimum value comparison of Attribute for the Credit Fee Constraint
                    maxOperator:
                      type: string
                      description: Operator for maximum value  comparison of Attribute for the Credit Fee Constraint
                    minValue:
                      type: string
                      description: Minimum value that is actually compared against the criteria attribute
                    maxValue:
                      type: string
                      description: Maximum value that is actually compared against the criteria attribute
    PriceErrorResponse404:
      required:
      - fault
      properties:
        fault:
          type: object
          required:
          - faultstring
          - detail
          properties:
            faultstring:
              type: string
              description: Error message
              example: 'Unable to identify proxy for host: secure-ewsglas and url: /ESO/rest/EWSG_PricingCashSheetV'
            detail:
              type: object
              required:
              - errorcode
              properties:
                errorcode:
                  type: string
                  description: Error code
                  example: messaging.adaptors.http.flow.ApplicationNotFound
    PriceResponse:
      required:
      - pricingResponse
      properties:
        pricingResponse:
          type: object
          additionalProperties: false
          required:
          - pricingResponseData
          - pricingResponseMetadata
          properties:
            pricingResponseData:
              type: object
              additionalProperties: false
              properties:
                pricingRequestResponseItems:
                  type: object
                  additionalProperties: false
                  required:
                  - executionType
                  - requestType
                  - pricingRequestResponseItem
                  properties:
                    executionType:
                      type: string
                      description: Specifies the type of execution through which the loan was purchased by an investor.
                      enum:
                      - Guarantor
                      - Cash
                      example: Guarantor
                    requestType:
                      type: string
                      description: The type of pricing request made by the Secondary Market Advisor or Seller.
                      enum:
                      - Rate Sheet
                      example: Rate Sheet
                    pricingRequestResponseItem:
                      type: array
                      additionalProperties: false
                      required:
                      - pricingRequestItem
                      - pricingResponseItem
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          pricingRequestItem:
                            type: object
                            additionalProperties: false
                            required:
                            - pricingRequestDetails
                            properties:
                              pricingRequestDetails:
                                type: object
                                additionalProperties: false
                                required:
                                - pricingRequestDetail
                                properties:
                                  pricingRequestDetail:
                                    type: array
                                    items:
                                      type: object
                                      additionalProperties: false
                                      required:
                                      - requestPriceType
                                      - requestScopeType
                                      - correlationId
                                      properties:
                                        requestPriceType:
                                          type: string
                                          description: The types of pricing a Seller or Secondary Market Advisor can request within the Pricing Service.
                                          enum:
                                          - Buyup/Buydown Ratios
                                          - Credit Fees in Fixed Dollar
                                          - Credit Fees in Price
                                          - Credit Fees in Yield
                                          example: Buyup/Buydown Ratios
                                        requestScopeType:
                                          type: string
                                          description: Specifies whether the customer requests all prices or prices that meet a specific set of criteria.
                                          enum:
                                          - Specific
                                          - All
                                          example: Specific
                                        correlationId:
                                          type: string
                                          description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                          example: 8704cn70184nc4817984n01n8798n8675308
                              seller:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                              sellerNumber:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                          pricingResponseItem:
                            type: object
                            additionalProperties: false
                            required:
                            - pricingResponseDetails
                            properties:
                              pricingResponseDetails:
                                type: object
                                additionalProperties: false
                                required:
                                - pricingResponseDetail
                                properties:
                                  pricingResponseDetail:
                                    type: array
                                    items:
                                      type: object
                                      oneOf:
                                      - type: object
                                        additionalProperties: false
                                        required:
                                        - fees
                                        - correlationId
                                        properties:
                                          correlationId:
                                            type: string
                                            description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                            example: 8704cn70184nc4817984n01n8798n8675308
                                          bubdGrids:
                                            $ref: '#/components/schemas/bubdGrids'
                                          errors:
                                            $ref: '#/components/schemas/errors'
                                          fees:
                                            $ref: '#/components/schemas/fees'
                                      - type: object
                                        additionalProperties: false
                                        required:
                                        - bubdGrids
                                        - correlationId
                                        properties:
                                          correlationId:
                                            type: string
                                            description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                            example: 8704cn70184nc4817984n01n8798n8675308
                                          fees:
                                            description: List fees
                                            enum:
                                            - []
                                          errors:
                                            $ref: '#/components/schemas/errors'
                                          bubdGrids:
                                            $ref: '#/components/schemas/bubdGrids'
                                      - type: object
                                        additionalProperties: false
                                        required:
                                        - errors
                                        - correlationId
                                        properties:
                                          correlationId:
                                            type: string
                                            description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                            example: 8704cn70184nc4817984n01n8798n8675308
                                          fees:
                                            description: List fees
                                            enum:
                                            - []
                                          errors:
                                            $ref: '#/components/schemas/errors'
                                          bubdGrids:
                                            enum:
                                            - []
                              seller:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                              sellerNumber:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                errors:
                  $ref: '#/components/schemas/errors'
            pricingResponseMetadata:
              type: object
              additionalProperties: false
              required:
              - correlationId
              - reponseDateTime
              properties:
                correlationId:
                  type: string
                  description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                  example: 8704cn70184nc4817984n01n8798n8675309
                reponseDateTime:
                  type: string
                  description: A system generated datetime stamp enclosed within each response.
                  example: 2021/01/20 13:43:05 638
    errors:
      type: object
      additionalProperties: false
      properties:
        error:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - errorMessage
            properties:
              errorCode:
                type: string
                description: Error code
              errorMessage:
                type: string
                description: Error message
    fees:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - pricingIdentifier
        - fee
        properties:
          pricingIdentifier:
            type: string
            description: An unique identification assigned to an entity (e.g., Seller) or contracting vehicle (e.g., MC).
            example: MC1234567
          fee:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - name
              - feeDetails
              properties:
                id:
                  type: string
                  description: The identifier for the credit fee.
                name:
                  type: string
                  description: The name of the credit fee.
                parentFeeID:
                  type: string
                  description: The identifier for the parent credit fee.
                feeDetails:
                  $ref: '#/components/schemas/feeDetails'
    PriceErrorResponse401:
      required:
      - Error
      properties:
        Error:
          type: string
          description: Error message
          example: Rejected by policy
    bubdGrids:
      type: array
      minItems: 1
      additionalProperties: false
      items:
        type: object
        additionalProperties: false
        required:
        - pricingIdentifier
        - bubdGrid
        properties:
          pricingIdentifier:
            type: string
            description: An unique identification assigned to an entity (e.g., Seller) or contracting vehicle (e.g., MC).
            example: MC1234567
          bubdGrid:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - gridIdentifier
              - effectiveDate
              - expirationDate
              - assessmentDateType
              - buyupBuydownOption
              properties:
                gridIdentifier:
                  type: string
                  description: Denotes the Grid Identifier which can be a combination of fields, for example, Product and Specified Pool Type.
                effectiveDate:
                  type: string
                  description: The assessment start date for the BUBD Ratios Grid.
                expirationDate:
                  type: string
                  description: The assessment end date for the BUBD Ratios Grid.
                assessmentDateType:
                  type: string
                  description: The available date types that may be used to trigger a fee to be assessed.
                refreshType:
                  type: string
                  description: Defines the frequency that a BUBD grid may be updated or changed using market pricing data.
                buyupBuydownOption:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - type
                    - noteRateRange
                    properties:
                      type:
                        type: string
                      noteRateRange:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - maxRate
                          - minRate
                          - remainingMaturity
                          properties:
                            maxRate:
                              type: string
                            minRate:
                              type: string
                            remainingMaturity:
                              $ref: '#/components/schemas/remainingMaturity'
    remainingMaturity:
      type: array
      items:
        type: object
        required:
        - maxMaturity
        - minMaturity
        - ratio
        additionalProperties: false
        properties:
          maxMaturity:
            type: string
            description: The maximum Remaning Maturity for all the loans eligible for allocation to the contract.
          minMaturity:
            type: string
            description: The remaining number of months for the loan repayment.
          ratio:
            type: string
            description: Buy up or Buy down ratio for the applicable Note Rate Range and Remaining Maturity.
    feeDetails:
      type: object
      additionalProperties: false
      required:
      - expirationDate
      - assessmentLevel
      - effectiveDate
      - assessmentDateType
      - criteria
      properties:
        expirationDate:
          type: string
          description: The assessment end date assigned to the credit fee.
        assessmentLevel:
          type: string
          description: Defines how a fee is charged in the system.
        effectiveDate:
          type: string
          description: The assessment start date assigned to the credit fee.
        assessmentDateType:
          type: string
          description: Identifies the contract or loan date that will trigger a credit fee.
        refreshType:
          type: string
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - criteriaDetails
            properties:
              type:
                type: string
              criteriaDetails:
                $ref: '#/components/schemas/criteriaDetails'
    PriceErrorResponse429:
      required:
      - code
      - details
      - message
      properties:
        code:
          type: string
          description: Error Code
        message:
          type: string
          description: Error Description
        details:
          type: array
          description: A collection of error details. Details container will contain error format.
          items:
            type: object
            required:
            - error
            properties:
              error:
                type: string
                description: Information about the error.
    PriceRequest:
      required:
      - pricingRequest
      properties:
        pricingRequest:
          type: object
          required:
          - pricingRequestData
          - pricingRequestMetadata
          properties:
            pricingRequestMetadata:
              type: object
              required:
              - templateVersion
              - requestDateTime
              - counterPartyType
              - correlationId
              properties:
                organizationId:
                  type: string
                  description: A unique value assigned by Freddie Mac.
                  example: '123456'
                correlationId:
                  type: string
                  description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                  example: 8704cn70184nc4817984n01n8798n8675309
                requestingPartyAccountIdentifier:
                  type: string
                  description: The unique identifier assigned by Freddie Mac for the party who requests the price sheets.
                  example: SMA123
                counterPartyType:
                  type: string
                  description: Identifies either the Secondary Market Advisor or the Seller who requests the price sheets.
                  example: Secondary Market Advisor
                requestDateTime:
                  type: string
                  description: A system generated datetime stamp enclosed within each request to identify the initiation time of the request.
                  example: 08/12/2020 02:03:10
                templateVersion:
                  type: string
                  description: The version of the latest JSON Pricing schema.
                  example: '1.0'
                vendorIdentifier:
                  type: string
                  description: A unique identifier that identifies the vendor.
                vendorName:
                  type: string
                  description: The vendor company name that identifies the vendor identifier.
                vendorSoftware:
                  type: string
                  description: The vendor software name utilized to submit the loan through the system.
                vendorSoftwareVersion:
                  type: string
                  description: The vendor software version name utilized to submit the loan through the system.
            pricingRequestData:
              type: object
              additionalProperties: false
              maxItems: 1
              required:
              - pricingRequestItems
              properties:
                pricingRequestItems:
                  type: object
                  minItems: 1
                  maxItems: 1
                  required:
                  - pricingRequestItem
                  - executionType
                  - priceRequestType
                  additionalProperties: false
                  properties:
                    executionType:
                      type: string
                      description: Specifies the type of execution through which the loan was purchased by an investor.
                      enum:
                      - Cash
                      - Guarantor
                      example: Guarantor
                    priceRequestType:
                      type: string
                      description: The type of pricing request made by the Secondary Market Advisor or Seller.
                      enum:
                      - Rate Sheet
                      example: Rate Sheet
                    pricingRequestItem:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                        - pricingRequestDetails
                        - seller
                        additionalProperties: false
                        properties:
                          seller:
                            type: string
                            description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                            example: '123456'
                          pricingRequestDetails:
                            type: object
                            minItems: 1
                            maxItems: 1
                            required:
                            - pricingRequestDetail
                            additionalProperties: false
                            properties:
                              pricingRequestDetail:
                                type: array
                                minItems: 1
                                items:
                                  type: object
                                  minItems: 1
                                  required:
                                  - correlationId
                                  - requestPriceType
                                  - requestScopeType
                                  additionalProperties: false
                                  properties:
                                    correlationId:
                                      type: string
                                      description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                      example: 8704cn70184nc4817984n01n8798n78705
                                    requestPriceType:
                                      type: string
                                      description: The types of pricing a Seller or Secondary Market Advisor can request within the Pricing Service.
                                      enum:
                                      - Buyup/Buydown Ratios
                                      - Credit Fees in Fixed Dollar
                                      - Credit Fees in Price
                                      - Credit Fees in Yield
                                      example: Buyup/Buydown Ratios
                                    requestScopeType:
                                      type: string
                                      description: Specifies whether the customer requests all prices or prices that meet a specific set of criteria.
                                      enum:
                                      - Specific
                                      - All
                                      example: Specific
                                    requestAttributes:
                                      type: object
                                      maxItems: 1
                                      required:
                                      - requestAttribute
                                      additionalProperties: false
                                      properties:
                                        requestAttribute:
                                          type: array
                                          minItems: 1
                                          uniqueItems: true
                                          items:
                                            type: object
                                            minItems: 1
                                            oneOf:
                                            - type: object
                                              additionalProperties: false
                                              properties:
                                                attributeName:
                                                  type: string
                                                  description: Provide request attribute name for Rate Sheet
                                                  enum:
                                                  - SettlementDateRange
                                                  - PricingIdentifier
                                                  - UserEnteredSecurityProductIdentifier
                                                  example: UserEnteredSecurityProductIdentifier
                                                values:
                                                  type: object
                                                  properties:
                                                    value:
                                                      type: string
                                                      minItems: 1
                                                      description: Provide request attribute value for Rate Sheet
                                                      example: M99999994
                                                  required:
                                                  - value
                                              required:
                                              - attributeName
                                              - values
                                            - type: object
                                              additionalProperties: false
                                              properties:
                                                attributeName:
                                                  type: string
                                                  description: Provide request attribute name for Rate Sheet
                                                  example: SettlementDateRange
                                                minValue:
                                                  type: string
                                                  description: Provide request attribute minimum value for Rate Sheet
                                                  example: 06/25/2020
                                                maxValue:
                                                  type: string
                                                  description: Provide request attribute maximum value for Rate Sheet
                                                  example: 06/28/2020
                                              required:
                                              - attributeName
                                              - minValue
                                              - maxValue
  examples:
    PriceRequestGuarantorBUBDSpecific:
      value:
        pricingRequest:
          pricingRequestMetadata:
            templateVersion: '1.0'
            correlationId: '123456789012345678901234567890123456'
            counterPartyType: Seller
            requestDateTime: 02/07/2022 01:43:10
            requestingPartyAccountIdentifier: '999999'
          pricingRequestData:
            pricingRequestItems:
              pricingRequestItem:
              - pricingRequestDetails:
                  pricingRequestDetail:
                  - requestPriceType: Buyup/Buydown Ratios
                    correlationId: '1234567890123456789012345678901234_1'
                    requestAttributes:
                      requestAttribute:
                      - attributeName: PricingIdentifier
                        values:
                          value:
                          - M99999991
                      - attributeName: SettlementDateRange
                        minValue: 02/15/2022
                        maxValue: 02/25/2022
                      - attributeName: UserEnteredSecurityProductIdentifier
                        values:
                          value:
                          - '2201'
                    requestScopeType: Specific
                seller: '999999'
              - pricingRequestDetails:
                  pricingRequestDetail:
                  - requestPriceType: Buyup/Buydown Ratios
                    correlationId: '1234567890123456789012345678901234_2'
                    requestAttributes:
                      requestAttribute:
                      - attributeName: PricingIdentifier
                        values:
                          value:
                          - M99999992
                      - attributeName: SettlementDateRange
                        minValue: 02/15/2022
                        maxValue: 02/25/2022
                      - attributeName: UserEnteredSecurityProductIdentifier
                        values:
                          value:
                          - 2201
                    requestScopeType: Specific
                seller: '999999'
              - pricingRequestDetails:
                  pricingRequestDetail:
                  - requestPriceType: Buyup/Buydown Ratios
                    correlationId: '1234567890123456789012345678901234_3'
                    requestAttributes:
                      requestAttribute:
                      - attributeName: PricingIdentifier
                        values:
                          value:
                          - M99999993
                      - attributeName: SettlementDateRange
                        minValue: 02/15/2022
                        maxValue: 02/25/2022
                      - attributeName: UserEnteredSecurityProductIdentifier
                        values:
                          value:
                          - 2221
                    requestScopeType: Specific
                seller: '999999'
              - pricingRequestDetails:
                  pricingRequestDetail:
                  - requestPriceType: Buyup/Buydown Ratios
                    correlationId: '1234567890123456789012345678901234_4'
                    requestAttributes:
                      requestAttribute:
                      - attributeName: PricingIdentifier
                        values:
                          value:
                          - M99999994

          - DAMAGED
          - MISSING_EQUIPMENT
          - DAMAGED_POOL_ENCLOSURE
          - UNSANITARY_WATER
        poolConcernDescription:
          type: string
          description: Provide a brief description of each pool concern noted if any pool concern type other than “None” was selected.e g.Large cracks were noted in the lining of the pool. Required IF ( /property/site/siteFeature/siteImprovements/ingroundPoolConcerns/poolConcernType   !=  'NONE' AND /property/propertyType = SF).<b>Note*</b> Maximum length must be less than 2500  characters.
      additionalProperties: false
    interiorDeficiency:
      required:
      - interiorDeficiencyName
      type: object
      properties:
        interiorDeficiencyName:
          type: string
          description: 'Indicate if any portion or element of a room has deferred maintenance and requires significant repair(s).  Also indicate if any item is missing. '

          - EVIDENCE_OF_LEAKS
          - EVIDENCE_OF_FIRE
          - OTHER
        mechanicalDeficiencySeverity:
          type: boolean
          description: Indicate if the noted deficiency to the mechanical component impacts the safety, soundness, or structural integrity of the structure or unit..Required if /property/buildings/units/mechanicalDeficiencies/mechanicalDeficiencyName != ‘NONE_OBSERVED’
        mechanicalDeficiencyDescription:
          type: string
          description: Provide a brief description of the Deficiency Type for the component that was selected. e.g., The toilet in the primary bathroom is leaking. <b>Note*</b> Maximum length must be less than 2500  characters.Required if /property/buildings/units/mechanicalDeficiencies/mechanicalDeficiencyName != ‘NONE_OBSERVED’
          example: The toilet in the primary bathroom is leaking.

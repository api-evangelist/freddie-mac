          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ExteriorDeficiency'
        exteriorUpdates:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ExteriorUpdate'
        units:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/unit'

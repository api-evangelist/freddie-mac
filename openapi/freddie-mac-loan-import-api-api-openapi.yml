                      type: integer
                      format: int32
                      example: 999999999
                    freddieMacLoanIdentifier:
                      description: A Freddie Mac supplied number assigned to the Mortgage by the Seller/Servicer.
                      type: string
                      example: '999999999'
                    primaryBorrowerIndividualFullName:
                      description: The unparsed name of either an individual or a legal entity.
                      type: string
                      example: AMERICA, ANDY
                    loanIdentifier:

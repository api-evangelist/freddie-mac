openapi: 3.2.0
info:
  title: Loan Import API
  version: 4.0.0
servers:
- url: https://api-test.freddiemac.com/single-family/lsa
security:
- bearerAuth: []
tags:
- name: Loan Import API
paths:
  /v1/loans/import:
    post:
      tags:
      - Loan Import API
      summary: Loan Import API
      description: 'The request metadata must be included in the ''requestMetadataJson'' field as a JSON object. Update the example JSON below to fit your scenario.


        **Example 1: Request Metadata for Seller for import and allocate an existing Loan to a Guarantor contract.**


        Please change the following fields to submit a valid request and “Try it out”


        ''sellerIdentifier'', ''sellerOrganizationBranchIdentifier'', ''investorContractIdentifier''

        ```json

        {

        "correlationIdentifier": "5234-1156-83456",

        "sellerIdentifier": "999999",

        "sellerOrganizationBranchIdentifier": 999999,

        "counterPartyType": "Seller",

        "overwriteExistingLoan": true,

        "contractUPBLimitIndicator": false,

        "useSellerLoanIdOnly": false,

        "requestToEvaluateLoans": false,

        "investorContractIdentifier": 99999999

        }

        ```


        **Example 2: Request Metadata for Seller for import, allocate and evaluate New Cash loan providing Contract number_in the file.**


        Please change the following fields to submit a valid request and “Try it out”


        ''sellerIdentifier'', ''sellerOrganizationBranchIdentifier'', ''pricingIdentifier''

        ```json

        {

        "correlationIdentifier": "1234-1126-83456",

        "sellerIdentifier": "999999",

        "sellerOrganizationBranchIdentifier": 999999,

        "counterPartyType": "Seller",

        "overwriteExistingLoan": false,

        "contractUPBLimitIndicator": true,

        "useSellerLoanIdOnly": false,

        "pricingIdentifier": "M99999999"

        }

        ```


        **Example 3: Request Metadata for Seller for import, allocate and evaluate new Cash Loan.**


        Please change the following fields to submit a valid request and “Try it out”


        ''sellerIdentifier'', ''sellerOrganizationBranchIdentifier'', ''investorContractIdentifier''

        ```json

        {

        "correlationIdentifier": "3234-1126-81456",

        "sellerIdentifier": "999999",

        "sellerOrganizationBranchIdentifier": 999999,

        "counterPartyType": "Seller",

        "overwriteExistingLoan": false,

        "contractUPBLimitIndicator": true,

        "useSellerLoanIdOnly": false,

        "investorContractIdentifier": 99999999

        }

        ```


        **Example 4: Request Metadata For Seller for Import and evaluate New_Unallocated Loan.**


        Please change the following fields to submit a valid request and “Try it out”


        ''sellerIdentifier'', ''sellerOrganizationBranchIdentifier''

        ```json

        {

        "correlationIdentifier": "7234-1156-53456",

        "sellerIdentifier": "999999",

        "sellerOrganizationBranchIdentifier": 999999,

        "counterPartyType": "Seller",

        "overwriteExistingLoan": false,

        "contractUPBLimitIndicator": false,

        "useSellerLoanIdOnly": false

        }

        ```


        **Example 5: Request Metadata for Secondary Market Advisor [SMA] for Import, allocate and evaluate New loan to a Guarantor contract providing a Pool number in the request metadata.**


        Please change the following fields to submit a valid request and “Try it out”


        ''sellerIdentifier'', ''sellerOrganizationBranchIdentifier'',''requestingPartyAccountIdentifier'', ''pricingIdentifier'', ''poolNumber''

        ```json

        {

        "correlationIdentifier": "9234-1196-53486",

        "sellerIdentifier": "999999",

        "sellerOrganizationBranchIdentifier": 999999,

        "requestingPartyAccountIdentifier": "SMA999",

        "counterPartyType": "SecondaryMarketAdvisor",

        "overwriteExistingLoan": false,

        "contractUPBLimitIndicator": false,

        "useSellerLoanIdOnly": false,

        "pricingIdentifier": "M99999999",

        "poolNumber": "SA9999"

        }

        ```'
      operationId: importLoanS2S
      parameters:
      - name: env
        in: header
        description: "<p>Environment \n\n </p>"
        required: false
        style: simple
        explode: false
        schema:
          type: string
          default: ProductionBaseline
          enum:
          - ProductionBaseline
          - Pre-Production
      - name: X-LIS-VENDOR-IDENTIFIER
        in: header
        description: A unique identifier that identifies the vendor.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: X-LIS-VENDOR-NAME
        in: header
        description: The vendor company name that identifies the vendor identifier.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: X-LIS-VENDOR-SOFTWARE
        in: header
        description: The vendor software name utilized to submit the loan through the system.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: X-LIS-VENDOR-SOFTWARE-VERSION
        in: header
        description: The vendor software version name utilized to submit the loan through the system.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              - requestMetadataJson
              type: object
              properties:
                file:
                  type: string
                  format: binary
                requestMetadataJson:
                  $ref: '#/components/schemas/LoanImportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanImportResponse'
              examples:
                ImportLoanResponse:
                  $ref: '#/components/examples/ImportLoanResponse'
        '400':
          description: "<b>Bad Request</b> \n\n <font size='1' color='black'><b>Error codes & details</b></font> \n\n <B>400.001</B> SellerIdentifier Required \n\n <B>400.002</B> SellerIdentifier Invalid Request Type. \n\n <B>400.003</B> FileIdentifier Required \n\n <B>400.004</B> FileIdentifier Invalid Request Type.   \n\n <B>400.005</B> SellerOrganizationBranchIdentifier Required \n\n <B>400.006</B> CorrelationIdentifier Required \n\n <B>400.007</B> CorrelationIdentifier Invalid Data Type. \n\n <B>400.008</B> PoolNumber Invalid Request Type. \n\n <B>400.009</B> Invalid PoolNumber Response\n\n <B>400.010</B> ContractUPBLimitIndicator Required \n\n "
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanImportFileStatusRequest'
              examples:
                SellerIdentifierRequiredResponse:
                  $ref: '#/components/examples/SellerIdentifierRequiredResponse'
                SellerIdentifierInvalidRequestTypeResponse:
                  $ref: '#/components/examples/SellerIdentifierInvalidRequestTypeResponse'
                FileIdentifierRequiredResponse:
                  $ref: '#/components/examples/FileIdentifierRequiredResponse'
                FileIdentifierInvalidRequestTypeResponse:
                  $ref: '#/components/examples/FileIdentifierInvalidRequestTypeResponse'
                SellerOrganizationBranchIdentifierRequiredResponse:
                  $ref: '#/components/examples/SellerOrganizationBranchIdentifierRequiredResponse'
                CorrelationIdentifierRequiredResponse:
                  $ref: '#/components/examples/CorrelationIdentifierRequiredResponse'
                CorrelationIdentifierInvalidDataTypeResponse:
                  $ref: '#/components/examples/CorrelationIdentifierInvalidDataTypeResponse'
                PoolNumberInvalidRequestTypeResponse:
                  $ref: '#/components/examples/PoolNumberInvalidRequestTypeResponse'
                InvalidPoolNumberResponse:
                  $ref: '#/components/examples/InvalidPoolNumberResponse'
                ContractUPBLimitIndicatorRequiredResponse:
                  $ref: '#/components/examples/ContractUPBLimitIndicatorRequiredResponse'
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>401</B> Rejected by policy"
          content:
            application/json:
              examples:
                ImportErrorResponse401:
                  $ref: '#/components/examples/ImportErrorResponse401'
        '403':
          description: "<b>The user does not have the permission to access the function</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>403</B> Rejected by policy"
          content:
            application/json:
              examples:
                ImportErrorResponse403:
                  $ref: '#/components/examples/ImportErrorResponse403'
        '500':
          description: "<p><strong>Internal Server Error</strong></p>\n <p><small><small>Error codes &amp; details</small></small></p> <ul><strong>500:</strong> An application error has occurred. Please call 1-800-FREDDIE to report this problem. </ul>"
          content:
            application/json:
              examples:
                FileImportStatusInternalErrorResponse:
                  $ref: '#/components/examples/FileImportStatusInternalErrorResponse'

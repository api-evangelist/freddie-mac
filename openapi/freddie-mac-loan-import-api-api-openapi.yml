                            type: string
                            example: ImportError, AllocationError, ProductError, EvaluationError, InternalError, ImportWarning, RepresentationAndWarrantyReliefError
                          criticalityType:
                            description: The level of criticality for the error returned when the loan is evaluated.
                            type: string
                            example: Warning, Error
                          complianceType:
                            description: The compliance type for the evaluation error or warning returned when the loan is evaluated.
                            type: string
                            example: Collateral, DataReasonableness, AppraisalEligibility, Collateral, Income, Asset
    LoanImportFileStatusRequest:
      description: This is the request metadata for Loan Import Status processing.
      required:
      - correlationIdentifier
      - sellerIdentifier
      - sellerOrganizationBranchIdentifier
      - counterPartyType
      - fileIdentifier
      type: object
      properties:
        correlationIdentifier:
          type: string
          description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
          example: '9999'
        sellerIdentifier:
          maxLength: 6
          type: string
          description: The unique identifier assigned to a party,  which may be an individual, a counterparty, or a related organization.
          example: '999999'
        sellerOrganizationBranchIdentifier:
          type: integer
          description: The unique identifier assigned for an organization unit.
          example: 999999
        requestingPartyAccountIdentifier:
          type: string
          description: The unique identifier assigned to a party, which may be an individual or a counterparty.
          example: SMA999
        counterPartyType:
          type: string
          description: A discrete set of values that specifies the different roles that a counterparty will perform in relationship with Freddie Mac.
          example: Seller
        fileIdentifier:
          type: integer
          description: The file identifier for the import loan file.
          example: 9999

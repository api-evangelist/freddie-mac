openapi: 3.2.0
info:
  title: Cash Pricing API
  description: Obtain contract-level (asset price), loan-level (all-in price), or cash fees (Single-Family Seller/Servicer Guide Exhibit 19 and negotiated) pricing.
  version: 1.0.0
servers:
- url: https://lassvcs-uat.fmrei.com/ESO/rest
security:
- basicAuth: []
tags:
- name: Cash Pricing
  description: Obtain contract-level (asset price), loan-level (all-in price), or cash fees (Single-Family Seller/Servicer Guide Exhibit 19 and negotiated) pricing.
paths:
  /EWSG_PricingCashSheetV1.0:
    post:
      operationId: price
      tags:
      - Cash Pricing
      summary: Cash Pricing
      parameters:
      - name: Content-Type
        in: header
        description: Content type to be passed as a header
        required: true
        schema:
          type: string
          default: application/json
      - name: env
        in: header
        description: 'Environment:'
        schema:
          type: string
          enum:
          - ProductionBaseline
          - Pre-Production
          default: ProductionBaseline
      - name: version
        in: header
        description: API Version
        schema:
          type: string
          default: '3.1'
      requestBody:
        description: 'Please change following fields to submit a valid request and ''Try it out'' (where applicable): <div><ul><li> RequestingPartyAccountIdentifier</li><li> CounterPartyType </li><li>SellerIdentifier</li><li>PricingIdentifier</li></ul></br> <br/> <b>Please refer to RELATED DOCUMENTATION for more examples.</b>'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequest'
            examples:
              Cash Asset Request Mandatory FR Retained:
                $ref: '#/components/examples/PriceRequestCashAssetMandatoryFixedRetainedCSPT'
              Cash Asset Request Best Efforts FR Retained:
                $ref: '#/components/examples/PriceRequestCashAssetBestEffortRetained'
              Cash Asset Request Best Efforts FR CTOS:
                $ref: '#/components/examples/PriceRequestCashAssetBestEffortCTOS'
              Cash All In Request Best Efforts FR CTOS:
                $ref: '#/components/examples/PriceRequestCashAllInBestEffortCTOS'
              Cash Asset Request Mandatory FR Released:
                $ref: '#/components/examples/PriceRequestCashAssetMandatoryFixedReleasedCSPT'
              Cash Asset Request Best Efforts FR Released:
                $ref: '#/components/examples/PriceRequestCashAssetBestEffortReleased'
              Cash Asset Request Mandatory ARM Retained:
                $ref: '#/components/examples/PriceRequestCashAssetARMMandatoryRetained'
              Cash Asset Request Mandatory FR CTOS:
                $ref: '#/components/examples/PriceRequestCashAssetMandatoryFixedCTOS'
              Cash All In Request Mandatory FR CTOS:
                $ref: '#/components/examples/PriceRequestCashAllInPriceFixedMandatoryCTOS'
              Cash All In Request Mandatory FR Retained:
                $ref: '#/components/examples/PriceRequestCashAllInPriceFixedMandatoryRetained'
              Cash Credit Fees in Price Request:
                $ref: '#/components/examples/PriceRequestCashCreditFeeInPriceAllFees'
        required: true
      responses:
        '200':
          description: "<b>OK</b> \n\n <font size='2' color='black'><b>Business error codes and details can be found in related documentation.</b></font>\n\n <B>Scenarios</B> \n\n <B>7208</B> Precision exceeds the maximum allowed 3 decimal places for Servicing Fee. \n\n <B>7219</B> Invalid value for Contract Option. Valid values are [Best Efforts, Mandatory]. \n\n <B>DQR3004</B> Interest Rate Minimum Percent must be less than or equal to the Interest Rate Maximum Percent. \n\n <B>DQR3006</B> Servicing Fee Rate must be valid. \n\n <B>DQR3008</B> Contract Period must be between 2-90 days. \n\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
              examples:
                Cash Asset Response Mandatory FR Retained:
                  $ref: '#/components/examples/PriceResponseCashAssetMandatoryFixedRetainedCSPT'
                Cash Asset Response Best Efforts FR Retained:
                  $ref: '#/components/examples/PriceResponseCashAssetBestEffortRetained'
                Cash Asset Response Best Efforts FR CTOS:
                  $ref: '#/components/examples/PriceResponseCashAssetBestEffortCTOS'
                Cash All In Response Best Efforts FR CTOS:
                  $ref: '#/components/examples/PriceResponseCashAllInBestEffortCTOS'
                Cash Asset Response Mandatory FR Released:
                  $ref: '#/components/examples/PriceResponseCashAssetMandatoryFixedReleasedCSPT'
                Cash Asset Response Best Efforts FR Released:
                  $ref: '#/components/examples/PriceResponseCashAssetBestEffortReleased'
                Cash Asset Response Mandatory ARM Retained:
                  $ref: '#/components/examples/PriceResponseCashAssetARMMandatoryRetained'
                Cash Asset Response Mandatory FR CTOS:
                  $ref: '#/components/examples/PriceResponseCashAssetMandatoryFixedCTOS'
                Cash All In Response Mandatory FR CTOS:
                  $ref: '#/components/examples/PriceResponseCashAllInPriceFixedMandatoryCTOS'
                Cash All In Response Mandatory FR Retained:
                  $ref: '#/components/examples/PriceResponseCashAllInPriceFixedMandatoryRetained'
                Cash Credit Fees in Price Response:
                  $ref: '#/components/examples/PriceResponseCashCreditFeeInPriceAllFees'
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>401</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse401'
              example:
                Error: Rejected by policy
        '404':
          description: "<b>Not Found</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>404</b> Not Found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse404'
              example:
                fault:
                  faultstring: 'Unable to identify proxy for host: secure-ewsglas and url: /ESO/rest/EWSG_PricingCashSheetV'
                  detail:
                    errorcode: messaging.adaptors.http.flow.ApplicationNotFound
        '429':
          description: "<b>Too Many Requests</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>429.001</b> Rate limit exceeded, decrease the number of requests per second been sent. \n\n <b>429.002</b> Quota limit exceeded, decrease the number of requests per minute been sent."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse429'
              example:
                code: 429.001
                message: Rate limit exceeded
                details:
                - error: Rate limit exceeded, decrease the number of requests per second been sent.
        '500':
          description: "<b>Internal server error.</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>500</b> An error occurred while processing your request. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance. \n\n <b>500</b> Message too large \n\n <b>500</b> Invalid JSON format"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse500'
              example:
                pricingResponse:
                  pricingResponseData:
                    errors:
                      error:
                      - errorCode: SE1000
                        errorMessage: An error occured while processing your request. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance.
                  pricingResponseMetadata:
                    correlationId: 8704cn70184nc4817984n01n8798n7870001
                    reponseDateTime: 2025/07/14 16:15:45 039
components:
  schemas:
    criteriaDetails:
      type: object
      additionalProperties: false
      required:
      - row
      properties:
        row:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - column
            properties:
              column:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - attributeName
                  - type
                  properties:
                    attributeName:
                      type: string
                      description: Identifies the attribute for the credit fee constraint.
                    value:
                      type: string
                      description: The actual value that is used to compare against the criteria attribute.
                    type:
                      type: string
                      description: The type of credit fee constraint for the category.
                    operator:
                      type: string
                      description: An operator determining the criteria of a fee.
                    minOperator:
                      type: string
                      description: Operator for minimum value comparison of Attribute for the Credit Fee Constraint
                    maxOperator:
                      type: string
                      description: Operator for maximum value  comparison of Attribute for the Credit Fee Constraint
                    minValue:
                      type: string
                      description: Minimum value that is actually compared against the criteria attribute
                    maxValue:
                      type: string
                      description: Maximum value that is actually compared against the criteria attribute
    PriceErrorResponse500:
      properties:
        pricingResponse:
          type: object
          properties:
            pricingResponseData:
              type: object
              properties:
                errors:
                  type: object
                  properties:
                    error:
                      type: array
                      items:
                        type: object
                        properties:
                          errorCode:
                            type: string
                          errorMessage:
                            type: string
                        required:
                        - errorCode
                        - errorMessage
                  required:
                  - error
              required:
              - errors
            pricingResponseMetadata:
              type: object
              properties:
                correlationId:
                  type: string
                reponseDateTime:
                  type: string
              required:
              - correlationId
              - reponseDateTime
          required:
          - pricingResponseData
          - pricingResponseMetadata
      required:
      - pricingResponse
    PriceErrorResponse404:
      required:
      - fault
      properties:
        fault:
          type: object
          required:
          - faultstring
          - detail
          properties:
            faultstring:
              type: string
              description: Error message
              example: 'Unable to identify proxy for host: secure-ewsglas and url: /ESO/rest/EWSG_PricingCashSheetV'
            detail:
              type: object
              required:
              - errorcode
              properties:
                errorcode:
                  type: string
                  description: Error code
                  example: messaging.adaptors.http.flow.ApplicationNotFound
    PriceResponse:
      required:
      - pricingResponse
      properties:
        pricingResponse:
          type: object
          additionalProperties: false
          required:
          - pricingResponseData
          - pricingResponseMetadata
          properties:
            pricingResponseData:
              type: object
              additionalProperties: false
              properties:
                pricingRequestResponseItems:
                  type: object
                  additionalProperties: false
                  required:
                  - executionType
                  - requestType
                  - pricingRequestResponseItem
                  properties:
                    executionType:
                      type: string
                      description: Specifies the type of execution through which the loan was purchased by an investor.
                      enum:
                      - Cash
                      - Guarantor
                      example: Cash
                    requestType:
                      type: string
                      description: The type of pricing request made by the Secondary Market Advisor or Seller.
                      enum:
                      - Rate Sheet
                      example: Rate Sheet
                    pricingRequestResponseItem:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - pricingRequestItem
                        - pricingResponseItem
                        properties:
                          pricingRequestItem:
                            type: object
                            additionalProperties: false
                            required:
                            - pricingRequestDetails
                            properties:
                              pricingRequestDetails:
                                type: object
                                additionalProperties: false
                                required:
                                - pricingRequestDetail
                                properties:
                                  pricingRequestDetail:
                                    type: array
                                    items:
                                      type: object
                                      additionalProperties: false
                                      required:
                                      - requestPriceType
                                      - requestScopeType
                                      - correlationId
                                      properties:
                                        requestPriceType:
                                          type: string
                                          description: The types of pricing a Seller or Secondary Market Advisor can request within the Pricing Service.
                                          enum:
                                          - Asset Price
                                          - All in Price
                                          example: Asset Price
                                        requestScopeType:
                                          type: string
                                          description: Specifies whether the customer requests all prices or prices that meet a specific set of criteria.
                                          enum:
                                          - Specific
                                          example: Specific
                                        correlationId:
                                          type: string
                                          description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                          example: 8704cn70184nc4817984n01n8798n8675308
                              seller:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                              sellerNumber:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                          pricingResponseItem:
                            type: object
                            additionalProperties: false
                            required:
                            - pricingResponseDetails
                            properties:
                              pricingResponseDetails:
                                type: object
                                additionalProperties: false
                                required:
                                - pricingResponseDetail
                                properties:
                                  pricingResponseDetail:
                                    type: array
                                    items:
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        correlationId:
                                          type: string
                                          description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                          example: 8704cn70184nc4817984n01n8798n8675308
                                        fees:
                                          $ref: '#/components/schemas/fees'
                                        errors:
                                          $ref: '#/components/schemas/errors'
                                        indicationPrices:
                                          $ref: '#/components/schemas/indicationPrices'
                              seller:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                              sellerNumber:
                                type: string
                                description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                                example: '123456'
                errors:
                  $ref: '#/components/schemas/errors'
            pricingResponseMetadata:
              type: object
              additionalProperties: false
              required:
              - correlationId
              - reponseDateTime
              properties:
                correlationId:
                  type: string
                  description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                  example: 8704cn70184nc4817984n01n8798n8675309
                reponseDateTime:
                  type: string
                  description: A system generated datetime stamp enclosed within each response.
                  example: 2025/07/14 13:43:05 638
    product:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - name
        - noteRate
        properties:
          name:
            type: string
            description: The highest indicator of the types of mortgages that can be delivered under a contract.
            example: 30-Year Fixed Rate Conventional
          cashSpecifiedPoolType:
            type: string
            description: Cash Specified Pool Type.
            example: Max LLB <= 200,000
          noteRate:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - value
              - contractPeriod
              properties:
                value:
                  type: string
                  description: The minimum interest rate for all the loans eligible for allocation to the contract.
                  example: '1.75'
                contractPeriod:
                  $ref: '#/components/schemas/contractPeriod'
    loanAssetPrice:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          description: The market based price for the value of the contract or loan.
          example: '102.642'
    PriceErrorResponse401:
      required:
      - Error
      properties:
        Error:
          type: string
          description: Error message
          example: Rejected by policy
    errors:
      type: object
      additionalProperties: false
      properties:
        error:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - errorMessage
            properties:
              errorCode:
                type: string
                description: Error code
              errorMessage:
                type: string
                description: Error message
    fees:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - pricingIdentifier
        - fee
        properties:
          pricingIdentifier:
            type: string
            description: An unique identification assigned to an entity (e.g., Seller) or contracting vehicle (e.g., MC).
            example: MC1234567
          fee:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - name
              - feeDetails
              properties:
                id:
                  type: string
                  description: The identifier for the credit fee.
                name:
                  type: string
                  description: The name of the credit fee.
                parentFeeID:
                  type: string
                  description: The identifier for the parent credit fee.
                feeDetails:
                  $ref: '#/components/schemas/feeDetails'
    loanSRPPrice:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          description: The Servicing bid for a contract or loan.
          example: '102.642'
    feeDetails:
      type: object
      additionalProperties: false
      required:
      - expirationDate
      - assessmentLevel
      - effectiveDate
      - assessmentDateType
      - criteria
      properties:
        expirationDate:
          type: string
          description: The assessment end date assigned to the credit fee.
        assessmentLevel:
          type: string
          description: Defines how a fee is charged in the system.
        effectiveDate:
          type: string
          description: The assessment start date assigned to the credit fee.
        assessmentDateType:
          type: string
          description: Identifies the contract or loan date that will trigger a credit fee.
        refreshType:
          type: string
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - criteriaDetails
            properties:
              type:
                type: string
              criteriaDetails:
                $ref: '#/components/schemas/criteriaDetails'
    PriceErrorResponse429:
      required:
      - code
      - details
      - message
      properties:
        code:
          type: string
          description: Error Code
        message:
          type: string
          description: Error Description
        details:
          type: array
          description: A collection of error details. Details container will contain error format.
          items:
            type: object
            required:
            - error
            properties:
              error:
                type: string
                description: Information about the error.
    PriceRequest:
      required:
      - pricingRequest
      properties:
        pricingRequest:
          type: object
          required:
          - pricingRequestData
          - pricingRequestMetadata
          properties:
            pricingRequestMetadata:
              type: object
              additionalProperties: false
              required:
              - templateVersion
              - requestDateTime
              - counterPartyType
              - correlationId
              properties:
                organizationId:
                  type: string
                  description: A unique value assigned by Freddie Mac.
                  example: '123456'
                correlationId:
                  type: string
                  description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                  example: 8704cn70184nc4817984n01n8798n8675309
                requestingPartyAccountIdentifier:
                  type: string
                  description: The unique identifier assigned by Freddie Mac for the party who requests the price sheets.
                  example: SMA123
                counterPartyType:
                  type: string
                  description: Identifies either the Secondary Market Advisor or the Seller who requests the price sheets.
                  example: Secondary Market Advisor
                requestDateTime:
                  type: string
                  description: A system generated datetime stamp enclosed within each request to identify the initiation time of the request.
                  example: 08/12/2020 02:03:10
                templateVersion:
                  type: string
                  description: The version of the latest JSON Pricing schema.
                  example: '1.0'
                vendorIdentifier:
                  type: string
                  description: A unique identifier that identifies the vendor.
                vendorName:
                  type: string
                  description: The vendor company name that identifies the vendor identifier.
                vendorSoftware:
                  type: string
                  description: The vendor software name utilized to submit the loan through the system.
                vendorSoftwareVersion:
                  type: string
                  description: The vendor software version name utilized to submit the loan through the system.
            pricingRequestData:
              type: object
              additionalProperties: false
              maxItems: 1
              required:
              - pricingRequestItems
              properties:
                pricingRequestItems:
                  type: object
                  minItems: 1
                  maxItems: 1
                  required:
                  - pricingRequestItem
                  - executionType
                  - priceRequestType
                  additionalProperties: false
                  properties:
                    executionType:
                      type: string
                      description: Specifies the type of execution through which the loan was purchased by an investor.
                      enum:
                      - Cash
                      - Guarantor
                      example: Cash
                    priceRequestType:
                      type: string
                      description: The type of pricing request made by the Secondary Market Advisor or Seller.
                      enum:
                      - Rate Sheet
                      example: Rate Sheet
                    pricingRequestItem:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                        - pricingRequestDetails
                        - seller
                        properties:
                          seller:
                            type: string
                            description: The unique identifier assigned to a party, which may be an individual, a counterparty, or a related organization.
                            example: '123456'
                          pricingRequestDetails:
                            type: object
                            minItems: 1
                            maxItems: 1
                            required:
                            - pricingRequestDetail
                            additionalProperties: false
                            properties:
                              pricingRequestDetail:
                                type: array
                                minItems: 1
                                items:
                                  type: object
                                  minItems: 1
                                  required:
                                  - correlationId
                                  - requestPriceType
                                  - requestScopeType
                                  properties:
                                    correlationId:
                                      type: string
                                      description: The unique identifier that is provided by the Seller or Secondary Market Advisor for each request.
                                      example: 8704cn70184nc4817984n01n8798n78705
                                    requestPriceType:
                                      type: string
                                      description: The types of pricing a Seller or Secondary Market Advisor can request within the Pricing Service.
                                      enum:
                                      - Asset Price
                                      - All in Price
                                      example: Asset Price
                                    requestScopeType:
                                      type: string
                                      description: Specifies whether the customer requests all prices or prices that meet a specific set of criteria.
                                      enum:
                                      - Specific
                                      example: Specific
                                    requestAttributes:
                                      type: object
                                      maxItems: 1
                                      required:
                                      - requestAttribute
                                      additionalProperties: false
                                      properties:
                                        requestAttribute:
                                          type: array
                                          minItems: 1
                                          uniqueItems: true
                                          items:
                                            type: object
                                            minItems: 1
                                            oneOf:
                                            - type: object
                                              additionalProperties: false
                                              properties:
                                                attributeName:
                                                  type: string
                                                  description: Provide request attribute name for Rate Sheet
                                                  enum:
                                                  - ProductDefinition
                                                  - ProductCashSpecifiedPoolTypeDefinition
                                                  - LoanPurchaseContractType
                                                  - ServicingOptionType
                                                  - CounterpartyAccountIdentifier
                                                  - ServicingFeeRate
                                                  - ContractRemittanceScheduleType
                                                  - ContractDurationDayCount
                                                  - ContractFixedInterestRateRange
                                                  - NoteAmount
                                                  - StateType
                                                  - ContractEscrowDepthType
                                                  - ContractAMinusIndicator
                                                  - ContractLTVRangeType
                                                  - CrossSellRightsRetentionIndicator
                                                  - PropertyEstateType
                                                  - ProjectLegalStructureType
                                                  - LPPriceLevel
                                                  - FinancedUnitCount
                                                  - ConstructionMethodType
                                                  - LegalEntityType
                                                  - LoanProductPaymentFrequencyType
                                                  - LoanScheduledFirstPaymentDate
                                                  - ConvertibleFlag
                                                  - AssumabilityIndicator
                                                  - LoanPurposeType
                                                  - LoanRefinanceCashOutDeterminationType
                                                  - LoanReferenceProductLabel
                                                  - PUDIndicator
                                                  - LoanPropertyUsageType
                                                  - NoteRate
                                                  - LoanLevelCreditScoreValue
                                                  - LTVRatioPercent
                                                  - CombinedLTVRatioPercent
                                                  - RefinanceProgramIdentifierType
                                                  - InvestorFeatureIdentifier
                                                  - LoanProgramIdentifierType
                                                  - MortgageConformityType
                                                  - HMDARateSpreadPercent
                                                  - LoanOriginatorType
                                                  - BuyDownTemporarySubsidyIndicator
                                                  - OtherInterestRate
                                                  - RemoteOnlineNotarizationIndicator
                                                  example: LoanPurchaseContractType
                                                values:
                                                  type: object
                                                  properties:
                                                    value:
                                                      type: array
                                                      minItems: 1
                                                      items:
                                                        oneOf:
                                                        - type: string
                                                          description: Provide request attribute value for Rate Sheet
                                                          example: Mandatory
                                                        - type: object
                                                          additionalProperties: false
                                                          required:
                                                          - productId
                                                          - cashSpecifiedPoolType
                                                          properties:
                                                            productId:
                                                              type: string
                                                              description: Production Definition Identifier
                                                              example: '1002'
                                                            cashSpecifiedPoolType:
                                                              type: array
                                                              minItems: 1
                                                              items:
                                                                type: string
                                                                description: Cash Specified Pool Type
                                                                example: Max LLB <= 200,000
                                                  required:
                                                  - value
                                              required:
                                              - attributeName
                                              - values
                                            - type: object
                                              additionalProperties: false
                                              properties:
                                                attributeName:
                                                  type: string
                                                  description: Provide request attribute name for Rate Sheet
                                                  example: ContractFixedInterestRateRange
                                                minValue:
                                                  type: string
                                                  description: Provide request attribute minimum value for Rate Sheet
                                                  example: '1'
                                                maxValue:
                                                  type: string
                                                  description: Provide request attribute maximum value for Rate Sheet
                                                  example: '7.75'
                                              required:
                                              - attributeName
                                              - minValue
                                              - maxValue
    indicationPrices:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - indicationPrice
        properties:
          pricingIdentifier:
            type: string
            description: An unique identification assigned to an entity (e.g., Seller) or contracting vehicle (e.g., MC).
            example: MC1234567
          indicationPrice:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - contractOptionality
              - remittanceOption
              - servicingFee
              - servicingOption
              - product
              properties:
                contractOptionality:
                  type: string
                  description: Indicates whether the contract is Best Efforts or Mandatory.
                  enum:
                  - Best Efforts
                  - Mandatory
                  example: Mandatory
                remittanceOption:
                  type: string

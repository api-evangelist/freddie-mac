openapi: 3.2.0
info:
  title: Guarantor Committing API
  description: Execute or modify Single Issue or MultiLender guarantor contracts.
  version: 1.0.0
servers:
- url: https://lassvcs-uat.fmrei.com/ESO/rest/lsa
security:
- basicAuth: []
tags:
- name: Guarantor Committing
  description: Execute or modify Single Issue or MultiLender guarantor contracts.
paths:
  /guarantor-contracts/price-v1:
    post:
      operationId: guarantor-price
      tags:
      - Guarantor Committing
      summary: Guarantor Committing Price
      parameters:
      - name: Content-Type
        in: header
        description: Content type to be passed as a header
        required: true
        schema:
          type: string
          default: application/json
      requestBody:
        description: 'Please change following fields to submit a valid request and ''Try it out'' (where applicable): <div><ul><li> RequestingPartyAccountIdentifier</li><li> CounterPartyType </li><li>SellerIdentifier</li><li>PricingIdentifier</li><li>CounterpartyAccountIdentifier</li></ul></div><br><B> Please refer to RELATED DOCUMENTATION for more examples.</B>'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuarantorCommitmentRequest'
            examples:
              Request Optional FR Single Issue:
                $ref: '#/components/examples/OptionalFixedRetainedSellerSingleIssueSecurityCouponLevelContractRequest'
              Request Optional ARM Single Issue:
                $ref: '#/components/examples/OptionalARMRetainedSellerSingleIssueSecurityCouponLevelContractRequest'
              Request Optional FR Multi-Lender:
                $ref: '#/components/examples/OptionalFixedRetainedSellerMultiIssueContractRequest'
        required: true
      responses:
        '200':
          description: "<b>OK</b> \n\n <font size='2' color='black'><b>Business error codes and details can be found in related documentation.</b></font>\n\n <B>Scenarios</B> \n\n <B>AUTH0002</B> Invalid Seller Identifier. \n\n <B>AUTH0003</B> Seller not eligible to take out contract. \n\n <B>AUTH0004</B> Invalid Requesting Party Account Identifier provided. \n\n <B>AUTH0007</B> Invalid Organization Identifier provided. \n\n <B>7233</B> Available Security Coupon and Pool Numbers is a required field for Multi-Lender Contracts. \n\n <B>7261</B> Settlement Date must be greater than or equal to current date plus the Settlement Cycle Days. \n\n <B>7652</B> The Pool Type is not allowed to be Multi-Lender for Odd Security Coupon contracts. Please adjust the Pool Type. \n\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuarantorContractPriceResponse'
              examples:
                Response Optional FR Single Issue:
                  $ref: '#/components/examples/OptionalFixedRetainedSellerSingleIssueSecurityCouponLevelContractResponse'
                Response Optional ARM Single Issue:
                  $ref: '#/components/examples/OptionalARMRetainedSellerSingleIssueSecurityCouponLevelContractResponse'
                Response Optional FR Multi-Lender:
                  $ref: '#/components/examples/OptionalFixedRetainedSellerMultiIssueContractResponse'
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>401</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse401'
              example:
                error: Rejected by policy
                code: 401.007
                errors:
                - status: Unauthorized
                  detail:
                  - error: Invalid User Credentials.
                  timestamp: '2025-09-15T19:19:39.906Z'
        '403':
          description: "<b>The user does not have the permission to access the function</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>403</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse403'
              example:
              - ErrorCode: '403'
                ErrorMessage: Rejected by Policy.
        '500':
          description: "<b>Internal server error.</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>500</b> The Loan Selling Advisor API being requested is currently unavailable. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance \n\n <b>500</b> Message too large \n\n <b>500</b> Invalid JSON format \n\n <b>500</b> Internal error \n\n <b>500</b> Request limit exceeded \n\n <b>500</b> Connection timeout from backend \n\n <b>500</b> Failed to establish backside connection"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse500'
              example:
                CorrelationIdentifier: e2b7048e-6307-48a5-b8a1-29235a91183a
                ResponseTime: 09/15/2025 16:37:23
                CommitmentPriceResponses:
                - CorrelationIdentifier: e2b7048e-6307-48a5-b8a1-29235a91183a
                  CommitmentRequestErrors:
                  - ErrorCode: '500'
                    ErrorMessage: The Loan Selling Advisor API being requested is currently unavailable. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance.
  /guarantor-contracts/price-decision-v1:

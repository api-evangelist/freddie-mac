components:
  schemas:
    GuarantorCommitmentRequest:
      required:
      - CommitmentRequestMetaData
      properties:
        CommitmentRequestMetaData:
          type: object
          properties:
            CorrelationIdentifier:
              type: string
              example: 533a425b-5823-4b43-9054-73490b7dbde9
            RequestTime:
              type: string
              example: 09/15/2025 10:10:10
            ResponseToken:
              title: ResponseToken to be sent for price and pairoff decision operations in hexcode format. The value should be same as the ResponseToken sent in price and pairoff operation respectively
              type: string
              example: 8bbef9261b2b4120de81ec6ce32caec448788cb9cf235bb3887376d3b13845c66713f4c1a2495956dee3915a68d33803
            RequestingPartyAccountIdentifier:
              type: string
              example: '999999'
            CounterPartyType:
              type: string
              example: Seller
            OrganizationIdentifier:
              type: number
              example: 73209
            VendorIdentifier:
              type: string
            VendorName:
              type: string
            VendorSoftware:
              type: string
            VendorSoftwareVersion:

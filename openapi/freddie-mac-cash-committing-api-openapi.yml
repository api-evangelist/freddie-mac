openapi: 3.2.0
info:
  title: Cash Committing API
  description: Execute fixed rate or adjustable rate (ARM) cash contracts.
  version: 1.0.0
servers:
- url: https://lassvcs-uat.fmrei.com/ESO/rest/lsa
security:
- basicAuth: []
tags:
- name: Cash Committing
  description: Execute fixed rate or adjustable rate (ARM) cash contracts.
paths:
  /cash-contracts/price-v1:
    post:
      operationId: price
      tags:
      - Cash Committing
      summary: Cash Committing
      parameters:
      - name: Content-Type
        in: header
        description: Content type to be passed as a header
        required: true
        schema:
          type: string
          default: application/json
      - name: env
        in: header
        description: 'Environment:'
        schema:
          type: string
          enum:
          - ProductionBaseline
          - Pre-Production
          default: ProductionBaseline
      - name: version
        in: header
        description: API Version
        schema:
          type: string
          default: '1.0'
      requestBody:
        description: 'Please change following fields to submit a valid request and ''Try it out'' (where applicable): <div><ul><li>RequestingPartyAccountIdentifier</li><li>CounterPartyType</li><li>SellerIdentifier</li><li>PricingIdentifier</li><li>CounterpartyAccountIdentifier</li></ul></div><br><B> Please refer to RELATED DOCUMENTATION for more examples.</B>'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashCommitmentRequest'
            examples:
              Request Mandatory ARM Retained:
                $ref: '#/components/examples/MandatoryARMSellerRetainedContractRequest'
              Request Mandatory Fixed Retained:
                $ref: '#/components/examples/MandatoryFixedSellerRetainedContractRequest'
              Request Mandatory Fixed Released:
                $ref: '#/components/examples/MandatoryFixedSellerReleasedContractRequest'
              Request Mandatory Fixed CTOS:
                $ref: '#/components/examples/MandatoryFixedSellerCTOSContractRequest'
              Request Mandatory Fixed CTOS v2.0:
                $ref: '#/components/examples/MandatoryFixedSellerCTOSNoAIFContRequest'
              Request Mandatory Fixed CTOS With AIF v2.0:
                $ref: '#/components/examples/ManFixedSellerCTOSContWithAIFContRequest'
              Request Best Efforts Fixed Retained:
                $ref: '#/components/examples/BestEffortsFixedSellerRetainedContractRequest'
        required: true
      responses:
        '200':
          description: "<b>OK</b> \n\n <font size='2' color='black'><b>Business error codes and details can be found in related documentation.</b></font>\n\n <B>Scenarios</B> \n\n <B>AUTH0002</B> Invalid Seller Identifier. \n\n <B>AUTH0003</B> Seller is not currently active. \n\n <B>AUTH0004</B> Invalid Requesting Party Account Identifier provided. \n\n <B>AUTH0007</B> Invalid Organization Identifier provided. \n\n <B>AUTH00010</B> Invalid Requesting Party Account Identifier and/or Organization Identifier provided. \n\n <B>AUTH00011</B> Requesting Party Account Identifier and/or Organization Identifier is not provided. \n\n <B>AUTH00014</B> Requesting Party Account Identifier is not provided. \n\n <B>AUTH00015</B> The user is not eligible for Counter Party Type of Secondary Market Advisor. \n\n <B>AUTH0016</B> Invalid request. please update servicingOption container. \n\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCommitmentPriceResponse'
              examples:
                Response Mandatory ARM Retained:
                  $ref: '#/components/examples/MandatoryARMSellerRetainedContractResponse'
                Response Mandatory Fixed Retained:
                  $ref: '#/components/examples/MandatoryFixedSellerRetainedContractResponse'
                Response Mandatory Fixed Released:
                  $ref: '#/components/examples/MandatoryFixedSellerReleasedContractResponse'
                Response Mandatory Fixed CTOS:
                  $ref: '#/components/examples/MandatoryFixedSellerCTOSContractResponse'
                Response Mandatory Fixed CTOS No AIF:
                  $ref: '#/components/examples/MandatoryFixedSellerCTOSNOAFIResponse'
                Response Mandatory Fixed CTOS With AIF:
                  $ref: '#/components/examples/ManFixedSellerCTOSContWithAllInFundRes'
                Response Best Efforts Fixed Retained:
                  $ref: '#/components/examples/BestEffortsFixedSellerRetainedContractResponse'
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>401</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse401'
              example:
                error: Rejected by policy
                code: 401.007
                errors:
                - status: Unauthorized
                  detail:
                  - error: Invalid User Credentials.
                  timestamp: '2025-08-07T19:19:39.906Z'
        '403':
          description: "<b>The user does not have the permission to access the function</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <B>403</B> Rejected by policy"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse403'
              example:
              - ErrorCode: '403'
                ErrorMessage: Rejected by Policy.
        '500':
          description: "<b>Internal server error.</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>500</b> The Loan Selling Advisor API being requested is currently unavailable. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance \n\n <b>500</b> Message too large \n\n <b>500</b> Invalid JSON format \n\n <b>500</b> Internal error \n\n <b>500</b> Request limit exceeded \n\n <b>500</b> Connection timeout from backend \n\n <b>500</b> Failed to establish backside connection"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceErrorResponse500'
              example:
                CorrelationIdentifier: e2b7048e-6307-48a5-b8a1-29235a91183a
                ResponseTime: 07/11/2025 16:37:23
                CommitmentPriceResponses:
                - ContractBase:
                    CorrelationIdentifier: e2b7048e-6307-48a5-b8a1-29235a91183a
                  CommitmentErrors:
                  - ErrorCode: '500'
                    ErrorMessage: The Loan Selling Advisor API being requested is currently unavailable. Please try again. If the problem persists, please call 1-800-FREDDIE for assistance.

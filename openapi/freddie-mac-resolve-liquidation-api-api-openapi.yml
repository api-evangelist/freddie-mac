                                  title: The actualSecondMortgagePayoffAmount Schema
                                  description: Dollar amount to payoff the second mortgage lien at the time of settlement.
                                  type: number
                                actualBorrowerContributionAmount:
                                  title: The actualBorrowerContributionAmount Schema
                                  description: Dollar amount in cash that the borrower will contribute towards the delinquent upb/interest at the time of settlement.
                                  type: number
                                actualInvestorRelocationAssistanceAmount:
                                  title: The actualInvestorRelocationAssistanceAmount Schema
                                  description: Dollar amount of first item of other liens on the property that will reduce the amount due to the investor.
                                  type: number
                                contractSalesPrice:
                                  title: The contractSalesPrice Schema
                                  description: The amount of money the contract is for
                                  type: number
                                closingDate:
                                  title: The ClosedDate Schema
                                  description: The date when Freddie Mac settles on the liquidation tterms agreed to with the borrower.
                                  type: string

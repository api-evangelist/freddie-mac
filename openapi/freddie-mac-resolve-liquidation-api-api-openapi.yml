                                  title: The secondMortgagePayoffAmount Schema
                                  description: Dollar amount to payoff the second mortgage lien.
                                  type: number
                                borrowerContributionAmount:
                                  title: The borrowerContributionAmount Schema
                                  description: Dollar amount in cash that the borrower will contribute towards the delinquent upb/interest.
                                  type: number
                                investorRelocationAssistance:
                                  title: The investorRelocationAssistance Schema
                                  description: Dollar amount of first item of other liens on the property that will reduce the amount due to the seller.
                                  type: number

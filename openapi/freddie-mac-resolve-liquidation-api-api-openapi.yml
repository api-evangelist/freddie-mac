openapi: 3.2.0
info:
  title: Resolve Liquidation API
  version: 1.0.0
  description: Resolve Liquidation API is a quicker, more efficient solution to submit short sale requests to Freddie Mac for decisioning and settlement.
servers:
- url: https://api-test.freddiemac.com/singlefamily/servicing/v1/resolve/liquidation-service/api
security:
- bearerAuth: []
tags:
- name: Resolve Liquidation API
  description: Resolve Liquidation API is a quicker, more efficient solution to submit short sale requests to Freddie Mac for decisioning and settlement.
paths:
  /shortsale:
    post:
      tags:
      - Resolve Liquidation API
      summary: Delivers real-time eligibility decisions and data for single or bulk short sale…
      description: ''
      operationId: requestWorkoutUsingPOST
      requestBody:
        description: Workout Service Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutServiceRequest'
            examples:
              LoanEligibleForShortSale:
                $ref: '#/components/examples/RequestScenario1'
              LoanNotEligibleExceptionReviewNotRequested:
                $ref: '#/components/examples/RequestScenario2'
              LoanNotEligibleExceptionReviewRequested:
                $ref: '#/components/examples/RequestScenario3'
        required: true
      responses:
        '200':
          description: "<b>OK</b> Request succeeded.\n\n <b>Sample Eligibility Messages</b> <br/> <ul> <li><strong>LM000047 </strong>Loan is in <i>status</i> status. Please review request and submit to Freddie Mac for exception review if necessary.\n </li><li><strong>LM000048 </strong>Sale must be an arm’s length transaction. All parties involved in the sale must be unrelated/unaffiliated.\n </li> <li><strong>LM000049 </strong>Total payment to junior lien holders is greater than $6,000. \n </li> <li><strong>LM000050 </strong>Payoff of the second mortgage loan cannot be greater than Second Lien UPB amount.\n </li> <li><strong>LM000052 </strong>Net Sale Proceeds does not meet Minimum Net Proceeds. \n </li> <li><strong>LM000053 </strong>Loan is active. Borrower does not have a qualifying hardship reason. Hardship Reason provided in the request is <<Hardship_Reason_Type_List::Alphanumeric>>.\n </li> <li><strong>LM000054 </strong>Loan is active and property is not Primary Residence.\n </li> <li><strong>LM000055 </strong>Borrower has Non Retirement Liquid Assets greater than $50,000.\n </li> <li><strong>LM000056 </strong>Cash contribution is less than minimum Borrower Cash Contribution requirement.\n </li> <li><strong>LM000057 </strong>Property does not meet MLS listing requirement, and was listed on MLS for less than 5 days.\n </li> <li><strong>LM000058 </strong>Borrower acquired a new mortgage within six months of DDLPI.\n </li> <li><strong>LM000059 </strong>Agent commissions exceed 6% of sales price.\n </li> <li><strong>LM000060 </strong>Cash Contribution is less than what was negotiated. Please validate the amount and resubmit.\n </li> <li><strong>LM000061 </strong>The amount paid to second mortgage lien holder(s) exceeds the authorized amount. Please validate the amount and resubmit.\n </li> <li><strong>LM000062 </strong>The amount paid for relocation expenses exceeds the authorized amount. Please validate the amount and resubmit.\n </li> <li><strong>LM000063 </strong>Final Net Proceeds amount is less than the authorized amount. Please send to Freddie Mac for Manual Settlement Review.\n </li> <li><strong>LM000064 </strong>MNP amount is missing. Please send to Freddie Mac for Manual Settlement Review.\n </li> <li><strong>LM000065 </strong>Loan is not eligible for Short Sale liquidation. Please review the Freddie Mac response and validate the terms submitted.\n </li> <li><strong>LM000066 </strong>Loan is approved for Short Sale liquidation.  Please review the final terms and submit for Settlement.\n </li> <li><strong>LM000067 </strong>Loan cannot be processed for Short Sale Liquidation Settlement. Please review the Freddie Mac response and resubmit the corrected information or submit for manual review.\n </li> <li><strong>LM000068 </strong>Loan has been successfully submitted for Settlement.  Please review your Manager Series reports for updates.\n </li> <li><strong>LM000069 </strong>Loan is Credit Enhanced with Recourse. \n </li> <li><strong>LM000089 </strong>Cooperative Share loan is ineligible for delegated short sale approval.\n </li> <li><strong>LM000090 </strong>Borrowers making cash contribution are not eligible for relocation incentive. Please validate contribution amount and relocation incentive amount and resubmit.\n </li> <li><strong>LM000091 </strong>Borrowers receiving DLA/Government Relocation Assistance are ineligible for Freddie Mac relocation incentive. \n </li> <li><strong>LM000092 </strong>Total relocation from Freddie Mac and alternative relocation source exceeds the authorized amount of $3,000.\n </li> <li><strong>LM000093 </strong>Cash contribution is less than minimum Borrower Cash Contribution requirement and no justification provided.\n </li> <li><strong>LM000094 </strong>Borrower cash contribution is less than calculated amount. Please ensure circumstances for reduced contribution amount are documented. \n </li> <li><strong>LM000099 </strong>Borrower ineligible for relocation assistance. Property is not Primary Residence or Owner Occupied. \n </li> <li><strong>LM000100 </strong>Loan is and not eligible for Freddie Mac Short Sale process. Please ensure Short Sale request is compliant with agency guidelines and follow claim filing process as outlined in Guide or submit to Freddie Mac for exception review if necessary. \n </li> <li><strong>LM000103 </strong>Property has not met MLS listing requirement and is not eligible for delegated shortsale review.\n </li> <li><strong>LI001100 </strong>data element is required.\n </li> <li><strong>LI001101 </strong>data element is invalid.\n </li> <li><strong>LI001152 </strong>Freddie Mac Loan Number is duplicate.\n </li> <li><strong>LI001163 </strong>Servicer number provided on the request is not authorized to process the loan.\n </li> <li><strong>LI001000 </strong>Invalid Schema.\n </li> <li><strong>LI001001 </strong>JSON parse exception.\n </li> <li><strong>LI001050 </strong>Exception occurred during processing. Please resubmit the workout request.\n </li> <li><strong>LI001152 </strong>Freddie Mac Loan Number is duplicate.\n </li> <li><strong>LI002001 </strong>Requested Loan Number does not belong to Freddie Mac.\n </li> <li><strong>LI002002 </strong>Freddie Mac Loan Number does not belong to the Servicer.\n </li> </ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutServiceResponse'
              examples:
                LoanEligibleForShortSaleResponse:
                  $ref: '#/components/examples/ResponseScenario1'
                LoanNotEligibleExceptionReviewNotRequestedResponse:
                  $ref: '#/components/examples/ResponseScenario2'
                LoanNotEligibleExceptionReviewRequestedResponse:
                  $ref: '#/components/examples/ResponseScenario3'
        '400':
          description: "<b>Bad Request</b> \n\n <font size='1' color='black'><b>Error codes & details</b></font> \n\n <ul> <li><B>400.001</B> Malformed content from the client \n\n </li><li><B>400.002</B> Request data does not match the application schema, please validate the request data. \n\n</li><li><B>400.005</B> Empty request body \n\n </li><li><B>400.006</B> Content-type must be application/json \n\n </li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '400.006'
                message: Missing header Content-type
                details:
                - error: Content-type must be application/json
        '401':
          description: "<b>Unauthorized</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <ul><li><B>401.001</B> Invalid Access Token, please validate the token, if error persists please renew your token. \n\n </li><li><b>401.002</b> Access Token Expired, please renew your access token. \n\n </li><li><b>401.003</b> API Product mismatch for token. Your token does not have access to the requested API \n\n </li><li><b>401.004</b> Invalid API Key, please validate the Client ID \n\n </li><li><b>401.005</b> Invalid API Key for given resource \n\n </li><li><b>401.006</b> Insufficient scope for Application \n\n </li><li><b>401.007</b> Invalid Username/Password combination, the provided combination of username and password is incorrect, please verify your credentials. \n\n </li><li><b>401.008</b> Invalid Refresh Token. \n\n </li><li><b>401.009</b> Invalid client secret \n\n </li><li><b>401.010</b> Refresh Token expired.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '401.002'
                message: Access Token Expired
                details:
                  error: Access Token Expired, please renew your access token.
        '404':
          description: "<b>Not Found</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>404.001</b> No resource for POST <b>/path</b>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '404.001'
                message: No resource for POST /path
                details:
                  error: No resource for POST /path
        '429':
          description: "<b>Too Many Requests</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>429.001</b> Rate limit exceeded, too many requests have been sent per second. \n\n <b>429.002</b> Quota limit exceeded, too many requests have been sent per minute."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 429.001
                message: Rate limit exceeded
                details:
                  error: Rate limit exceeded, too many requests have been sent per second.
        '500':
          description: "<b>Internal server error.</b> \n\n <font size='1' color='black'><b>Error codes & details </b></font> \n\n <b>500</b> Internal server error."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '500'
                message: Internal server error
                details:
                - error: Liquidation API is unable to retrieve data for the submitted request at this time. Please resubmit or contact Customer Support at (800-FREDDIE) for assistance.
      x-codegen-request-body-name: workoutServiceRequest

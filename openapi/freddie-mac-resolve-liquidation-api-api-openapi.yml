    WorkoutServiceResponse:
      title: WorkoutServiceResponse
      description: The root schema comprises the entire JSON document.
      type: object
      properties:
        message:
          title: The Message Schema
          type: object
          properties:
            aboutVersions:
              title: The Aboutversions Schema
              description: Dataset to capture the header information
              type: object
              properties:
                aboutVersion:
                  title: The Aboutversion Schema
                  description: Data set to capture the header information
                  type: object
                  properties:
                    aboutVersionIdentifier:
                      title: The Aboutversionidentifier Schema
                      description: This is the version number of the schema in use
                      type: string
                      example: S1.0.01
                    createdDatetime:
                      title: The Createddatetime Schema
                      description: The date and time stamp of response schema creation
                      type: string
                      example: '2019-09-19T09:29:11Z'
                  required:
                  - aboutVersionIdentifier
                  - createdDatetime
                  default: {}
                  example: {}
              required:
              - aboutVersion
              default: {}
            responseData:
              title: The Responsedata Schema
              description: Collection of the data attributes that depicts the response to a workout request.
              type: object
              properties:
                isRequestValid:
                  title: The isRequest valid Schema
                  description: Indicates any request level error occured
                  type: boolean
                requestResponseIdentifier:
                  title: The requestResponseIdentifier valid Schema
                  description: ' unique identifier that associates the response back to the original request'
                  type: integer
                errorList:
                  title: The Errorlist Schema
                  description: Request level eligilbity messages
                  type: array
                  items:
                    title: The Items Schema
                    type: object
                    properties:
                      errorCode:
                        title: The ErrorCode Schema
                        description: unique code representing schema validation error  encountered during the validation process
                        type: string
                      errorText:
                        title: The ErrorDescription Schema
                        description: Error description for the Schema validation error during the validation process.
                        type: string
                responseWorkoutList:
                  title: The Responseworkoutlist Schema
                  description: Collection of the data attributes that depicts the response to a workout request.
                  type: array
                  items:
                    type: object
                    properties:
                      loanIdentifier:
                        title: The Loanidentifier Schema
                        description: Unique Freddie Mac identifier assigned to a financial instrument within the system.
                        type: string
                      servicerAccountIdentifier:
                        title: The Servicer Account Identifier Schema
                        description: 'Unique identifier, issued by Freddie Mac, for the individual Seller or Servicer. '
                        type: string
                      servicerLoanIdentifier:
                        type: string
                      workoutProgramType:
                        title: The Workout Program Type Schema
                        description: The type workout being processed.
                        type: string
                      workoutReportingStatusType:
                        title: The Workout Reporting Status Type Schema
                        description: 'Type of Real Estate valuation data being requested to indicate if a request is for Minimum Net Proceeds, Credit Bid Valuation or Dispute data.

                          '
                        type: string
                      isValid:
                        title: The Isvalid Schema
                        description: Indicates when the processing encountered any format validation or loan validation errors
                        type: boolean
                      isMNPObtained:
                        title: The Is MNP Obtained Schema
                        description: Indicates the status of the MNP request to retreive property value
                        type: boolean
                      errorWorkoutList:
                        title: The Errorworkoutlist Schema
                        description: 'Collection of Loan level validation messages '
                        type: array
                        items:
                          type: object
                          properties:
                            workoutErrorCode:
                              title: The Workout Error Code Schema
                              description: Unique code representing format validation or loan validation error encountered during the validation process
                              type: string
                            workoutErrorDescription:
                              title: The workoutErrorDescription Schema
                              description: This is the error description for the Schema validation error during the validation process.
                              type: string
                            workoutErrorType:
                              title: The WorkoutErrorType Schema
                              description: Indicates the type of the error message
                              type: string

        '200':
          description: "<b>OK</b> Request succeeded.\n\n <b>Sample Eligibility Messages</b> <br/> <ul> <li><strong>LM000026</strong>    Loan is eligible for the Flex  modification. \n\n </li><li><strong>LM000027</strong>    Loan is not eligible for Flex modification.   Please review the Freddie Mac response and validate the terms submitted. Please resubmit the correct terms for processing or submit to Freddie Mac for non-delegated review. \n\n </li><li><strong>LM000028</strong>    Loan is approved for Flex modification settlement. Please review the final modified terms and submit for settlement. \n\n </li><li><strong>LM000029</strong>    Loan cannot be processed for Flex  modification settlement. Please review the Freddie Mac response and resubmit the corrected information or submit for manual review. \n\n </li><li><strong>LM000030</strong>    Loan has been successfully submitted for settlement. Please review your Manager Series reports for updates. \n\n </li><li><strong>LM000001</strong>    Loan originated less than 12 months ago. \n\n </li><li><strong>LM000002</strong>    Loan has been modified three or more times.  \n\n </li><li><strong>LM000003</strong>    Prior Flex Modification for this loan defaulted within 12 months from the current Evaluation Date. \n\n </li><li><strong>LM000004</strong>    Loan has failed Prior Flex Modification trial within 12 months from current Evaluation Date. \n\n </li><li><strong>LM000005</strong>    Loan is Credit Enhanced with Indemnification. \n\n </li><li><strong>LM000006</strong>    Borrower is not indicated to be in Imminent Default and the loan is insufficietly delinquent.  \n\n </li><li><strong>LM000018</strong>    Modification results in P&I increase. \n\n </li><li><strong>LM000019</strong>    Modified UPB is less than Current UPB. \n\n </li><li><strong>LM000020</strong>    The modification First Payment Due Date is same as prior modification First Payment Due Date. \n\n </li><li><strong>LM000021</strong>    The Pre Modification UPB provided in the request  does not match the Pre Modification UPB reported to Freddie Mac as of modification effective cycle. \n\n </li><li><strong>LM000022</strong>    The Pre Modification UPB provided in the request  does not match the Pre Modification UPB reported to Freddie Mac as of modification effective cycle. \n\n </li><li><strong>LM000023</strong>    The Delinquent Interest from DDLPI to Modification Effective Date provided in the request does not match the Freddie Mac expected Delinquent Interest. \n\n </ul>\n\n<b>Sample Data Validation Messages</b><br/> <ul> <li><strong>RE001104</strong> Workout Program Type is required.\n\n </li><li><strong>RE001106</strong> Seller Servicer Number is required.\n\n </li><li><strong>RE001109</strong> Freddie Mac Loan Number is invalid.\n\n </li><li><strong>RE002001</strong> Requested Loan Number does not belong to Freddie Mac.\n\n </li><li><strong>RE002002</strong> Freddie Mac Loan Number does not belong to the Servicer.\n\n"

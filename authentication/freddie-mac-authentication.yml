profile:
  primary: OAuth 2.0 bearer token issued by the Freddie Mac Apigee gateway
  secondary: HTTP Basic on the four Loan Selling Advisor pricing/committing services (lassvcs-uat.fmrei.com/ESO/rest)
  credential_issuance: System-to-system API credentials are issued by a Freddie Mac representative to
    an organisation with counterparty (Seller/Servicer) or approved technology-partner status; there is
    no self-service signup. A Developer Administrator then creates an app in the Developer Portal and
    requests promotion to production.
  token_endpoint_published: false
  token_endpoint_note: 'No OAuth token endpoint, authorization-server metadata document or /.well-known/oauth-authorization-server
    is published anonymously. Probed 2026-09-10: api.freddiemac.com and api-test.freddiemac.com both 404
    that path; developer.freddiemac.com 401s it. The token URL is documented only inside the authenticated
    portal.'
  grant_evidence: 'The 401 response descriptions in every gateway-fronted spec enumerate an OAuth 2.0
    credential lifecycle: 401.001 invalid access token, 401.002 access token expired, 401.003 API product
    mismatch for token, 401.004 invalid API key (client ID), 401.005 invalid API key for resource, 401.006
    insufficient scope for application, 401.007 invalid username/password combination, 401.008 invalid
    refresh token, 401.009 invalid client secret, 401.010 refresh token expired. Client ID + client secret
    + refresh tokens + per-product scope is an Apigee OAuth 2.0 deployment; the username/password code
    additionally implies a resource-owner-password grant.'
  scopes_published: false
  scopes_note: Scope is enforced (401.006 'Insufficient scope for Application' and 401.003 'API Product
    mismatch for token') but no scope names are published in any spec or on any public page, so no scopes/
    artifact was written rather than an invented one.

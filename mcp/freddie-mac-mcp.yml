agent_safety_note: 'If this catalog is ever exposed as MCP tools, the write tools need guardrails that
  do not exist in the contracts: there is no Idempotency-Key on any operation, no DELETE anywhere, and
  no reversal for import_loan or submit_closing_dataset. The two Committing APIs are the only surface
  with a rehearse-then-commit split and the only one with a reversal (pair-off). See conventions/.'
operationid_note: Every rest[] entry is a verbatim operationId grepped out of the contract it names. Note
  that `price` and `getPurchaseStatement` are each reused across two different APIs - operationIds are
  unique within a document but not across the catalog, so a crosswalk must key on (spec, operationId).

business_message_codes:
  note: Data Share and Data Share Bid Tape additionally publish a DSA* business-message vocabulary (DSA001-DSA061
    request/validation, DSA100-DSA109 document-availability outcomes such as 'Requested UCD_XML documents
    not found', DSA201-DSA204, DSA300-DSA304, DSA400, DSA700-DSA701, DSA800, DSA900-DSA903) carried in
    successful 200 responses, not in the HTTP error status. An agent must read the body to know whether
    the requested documents were actually found.
  families:
  - DSA0xx request/validation
  - DSA1xx document availability
  - DSA2xx
  - DSA3xx
  - DSA4xx
  - DSA7xx
  - DSA8xx
  - DSA9xx
anti_pattern: Error codes are published only as HTML fragments inside the OpenAPI response `description`
  strings (bold tags, font tags and <ul> lists embedded in the description), not as enumerated values
  in a schema. They are readable by a human rendering SwaggerUI and are not machine-addressable without
  parsing prose out of a description field - which is how this catalog was derived.

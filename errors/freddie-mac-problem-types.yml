format_note: 'NOT RFC 9457. Every 4xx/5xx body is application/json but the envelope is provider-specific
  and varies by API family - a census of the error schemas across the 20 specs found at least eight distinct
  shapes: {code, message, details[]} (11 schemas, the Apigee product APIs), {error} (13), {errorCode,
  errorDescription} (7), {errorEnvelope} (5), {errors[]} (5), {ErrorCode, ErrorMessage} (2), {Error} (2,
  Loan Selling Advisor pricing), {fault:{faultstring,detail:{errorcode}}} (2, raw Apigee fault passthrough)
  and {workoutErrorCode, workoutErrorDescription, workoutErrorType} (2, Resolve). An agent integrating
  across the catalog has to write a different error parser per API family. The Developer Portal''s OWN
  backend, by contrast, does return application/problem+json (probed 2026-09-10: GET https://developer.freddiemac.com/public/llms.txt
  -> 404 {"type":"about:blank","title":"Not Found","status":404,"detail":...,"instance":...}) - so the
  RFC 9457 shape exists in-house on the portal service but has not reached the product APIs.'

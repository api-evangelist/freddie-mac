lifecycle_flow: Income Limits / Affordable Check (pre-qualification) -> Property Insights and Beyond ACE
  (collateral) -> Loan Closing Advisor Loan Submission (UCD assessment at closing) -> Loan Import + Cash
  or Guarantor Pricing/Committing (delivery and sale) -> Cash/Guarantor Settlement Purchase Statement
  (settlement) -> Data Share and Data Share Bid Tape (post-close document retrieval) -> Resolve (default
  servicing). The catalog's five display categories - ORIGINATION, CLOSING, SELLING, POST CLOSE, SERVICING
  - are that flow.
id_prefixes:
  published: false
  note: No typed/prefixed identifier scheme (Stripe-style cus_/ch_). Identifiers are bare numeric or alphanumeric
    strings whose namespace is carried in a sibling *IdentifierType field.

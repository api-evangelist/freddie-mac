source: components.schemas and the identifier fields of the 20 first-party OpenAPI contracts in openapi/
  (404 schema definitions, 295 distinct names), cross-read against the MISMO / GSE Uniform Mortgage Data
  Program vocabulary the contracts declare
note: There is no shared component library across the catalog. Each API ships its own copy of the domain
  objects, so the same real-world entity appears under several spellings - sellerIdentifier / SellerIdentifier
  / sellerId, loanIdentifier / sellerLoanIdentifier / servicerLoanIdentifier / freddieMacLoanNumber. This
  graph is the entity model the catalog implies, not a model the provider publishes. The canonical names
  are MISMO's; the divergence is per-API implementation drift.

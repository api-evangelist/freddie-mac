aid: freddie-mac
name: Freddie Mac
description: 'Freddie Mac (Federal Home Loan Mortgage Corporation) is the government-sponsored enterprise that
  provides liquidity, stability and affordability to the U.S. housing market by purchasing and securitizing
  single-family and multifamily mortgages. Its Single-Family API programme is published through the Freddie
  Mac Developer Portal and spans the whole mortgage lifecycle: origination (Affordable Check, Income Limits,
  Loan Look Up, Property Insights, Current Mortgage Snapshot, Beyond ACE), closing (Loan Closing Advisor Loan
  Submission), selling and delivery (Cash and Guarantor Pricing, Committing and Settlement Purchase Statement,
  Loan Import into Loan Selling Advisor), post-close data retrieval (Loan Advisor Data Share, Data Share Bid
  Tape) and default servicing (the Resolve workout, liquidation and valuation/pricing decisioning services).
  The public catalog publishes 20 OpenAPI 3.0 contracts covering 45 operations; the request and response payloads
  are modelled on the MISMO reference model and the GSE Uniform Mortgage Data Program datasets (UAD, ULAD,
  ULDD, UCD).'

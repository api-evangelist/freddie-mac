x-base-url-finding:
  verdict: no-usable-base (production)
  checked: '2026-09-10'
  detail: 'Every base URL Freddie Mac publishes is a TEST host: api-test.freddiemac.com in 14 contracts and
    lassvcs-uat.fmrei.com in 4. Two contracts (Data Share, Data Share Bid Tape) carry an empty servers[] block
    and are recorded with no baseURL rather than a guess. The production host api.freddiemac.com demonstrably
    exists - it answers with an Apigee ApplicationNotFound fault at the root and serves its own /.well-known/security.txt
    with Canonical: https://api.freddiemac.com/.well-known/security.txt - but NO published contract, portal
    page or PDF states a production base PATH. It is issued inside the authenticated portal at app-promotion
    time. The provider-published test bases are recorded verbatim; no production base is invented from the
    test one.'
  evidence:
  - url: https://api.freddiemac.com/
    status: 404
    note: Apigee messaging.adaptors.http.flow.ApplicationNotFound - the host is real, the path is not
  - url: https://api.freddiemac.com/.well-known/security.txt
    status: 200
  - url: https://sf.freddiemac.com/docs/pdf/api-playbook.pdf
    status: 200
    note: 32-page Origination API Playbook; states no base URL
  - url: https://sf.freddiemac.com/tools-learning/apis/getting-started-with-apis
    status: 200
    note: states no base URL
  ownership: 'lassvcs-uat.fmrei.com is Freddie Mac infrastructure, not a third party: it resolves to 161.107.22.97,
    inside 161.107.0.0/16 whose ARIN record is NetName FHLMC / OrgName Federal Home Loan Mortgage Corporation
    - the same /16 as api.freddiemac.com (161.107.70.45) and api-test.freddiemac.com (161.107.18.44) - and
    it returns the same Apigee fault bodies. It is the Loan Selling Advisor gateway.'

- aid: freddie-mac:freddie-mac-resolve-liquidation-api-api
  name: Freddie Mac Resolve Liquidation API
  description: >-
    Resolve Liquidation API is a quicker, more efficient solution to submit short sale requests to Freddie
    Mac for decisioning and settlement. The API returns a real-time response that include eligibility
    decision, rationale for each loan submitted or actionable messages. For eligible responses you’ll
    also receive property and minimum net proceed values (if available), approvals and calculated net
    proceeds (if applicable). Connect directly to Resolve and eliminate the need for data entry through
    Workout Prospector®.
